name: dolphin-bot

on:
  workflow_dispatch:        # تشغيل يدوي
  workflow_run:             # إعادة التشغيل تلقائياً بعد انتهاء التشغيل السابق
    workflows: ["dolphin-bot"]
    types: [completed]
  schedule:
    # كل 4 ساعات: ضمان إعادة التشغيل لو فاتت سلسلة workflow_run
    - cron: '0 */4 * * *'

# منع تشغيل أكثر من job واحد في نفس الوقت
concurrency:
  group: dolphin-bot-runner
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 5.5 ساعات كحد أقصى (الحدي الأقصى للـ job هو 6h)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify secrets present
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] || { echo "TELEGRAM_TOKEN missing"; exit 1; }
          [ -n "$GH_TOKEN" ]          || { echo "GH_TOKEN missing"; exit 1; }
          echo "Secrets OK"

      - name: Run bot (with hard timeout 5h25m)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # نُشغّل البوت مع timeout صارم (19500 ثانية ≈ 5h25m)
          timeout 19500 python app.py || true
          echo "Bot run finished."

      - name: Trigger next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # إعادة تشغيل نفس الـ workflow لمواصلة العمل
          gh workflow run "$GITHUB_WORKFLOW" --repo "$GITHUB_REPOSITORY" || true
