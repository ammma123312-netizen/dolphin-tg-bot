name: dolphin-bot

on:
  workflow_dispatch:        # تشغيل يدوي
  schedule:
    # كل ساعتين: ضمان التشغيل الدوري
    - cron: '0 */2 * * *'

concurrency:
  group: dolphin-bot-runner
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify secrets present
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] || { echo "TELEGRAM_TOKEN missing"; exit 1; }
          [ -n "$GH_TOKEN" ]          || { echo "GH_TOKEN missing"; exit 1; }
          echo "Secrets OK"

      - name: Run bot (cloud fallback mode, 5h25m max)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # فرض وضع GitHub Models لأن Ollama لا يعمل داخل Actions
          OLLAMA_URL: http://127.0.0.1:1   # منفذ مغلق → يفشل Ollama ويستخدم GH Models
        run: |
          timeout 19500 python app.py || true
          echo "Bot run finished."

      - name: Trigger next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          sleep 30
          gh workflow run "$GITHUB_WORKFLOW" --repo "$GITHUB_REPOSITORY" || true
          echo "Triggered next run."
